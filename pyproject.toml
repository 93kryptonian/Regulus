[project]
name = "regulus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "reportlab>=4"]
ocr = ["pytesseract>=0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"regulus.relevance" = ["data/*.json"]
"regulus.obligations" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not corpus'"
markers = ["corpus: runs on the local, uncommitted PDF corpus (pytest -m corpus)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/regulus/review_ui/render.py" = ["E501"]
"src/regulus/review_ui/text.py" = ["E501"]
"src/regulus/notifications/compose.py" = ["E501"]
"src/regulus/notifications/events.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pytesseract.*"]
ignore_missing_imports = true
